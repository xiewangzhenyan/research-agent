
# Production configuration
# with external Nginx (config template provided)
#
# Usage:
#   1. Fill backend/.env with real production secrets (cp backend/.env.example
#      backend/.env if it doesn't exist yet). The same file is used for dev and
#      prod — there is no separate .env.prod.
#   2. Run: make prod   (or: docker compose --env-file backend/.env -f docker-compose.prod.yml up -d)
#
# Prerequisites:
#   1. Configure your external Nginx using nginx/nginx.conf as reference
#   2. Configure backend/.env with DOMAIN

services:

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agent_backend:dev
    container_name: agent_backend
    volumes:
      - media_data:/app/media
      - rag_models:/app/models_cache:ro
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 38001 --workers 2 --ws websockets-sansio
    networks:
      - backend-internal
      - egress
    ports:
      - "127.0.0.1:38001:38001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M


  reranker:
    image: agent_backend:dev
    container_name: agent_reranker
    command: uvicorn app.reranker.main:app --host 0.0.0.0 --port 38004 --workers 1 --no-access-log
    volumes:
      - rerank_models:/models:ro
    networks:
      - backend-internal
    environment:
      - HF_HUB_OFFLINE=1
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:38004/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3072M

  db:
    build:
      context: ./infrastructure/postgres
    image: agent-postgres:16.14-vector0.8.0
    container_name: agent_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO external ports - only accessible within backend-internal network
    networks:
      - backend-internal
      - egress
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: agent_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # NO external ports - only accessible within backend-internal network
    volumes:
      - redis_data:/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  celery_worker:
    image: agent_backend:dev
    container_name: agent_celery_worker
    volumes:
      - media_data:/app/media
      - rag_models:/app/models_cache:ro
    command: celery -A app.worker.celery_app worker --loglevel=warning --concurrency=1
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - backend-internal
      - egress
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  task_worker:
    image: agent_backend:dev
    container_name: agent_task_worker
    command: python -m app.worker.agent_runs
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=2
    volumes:
      - media_data:/app/media:ro
      - rag_models:/app/models_cache:ro
    networks:
      - backend-internal
      - egress
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # asyncio.run handles SIGINT by cancelling tasks and closing checkpoint connections.
    stop_signal: SIGINT
    stop_grace_period: 15s
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M

  celery_beat:
    image: agent_backend:dev
    container_name: agent_celery_beat
    command: celery -A app.worker.celery_app beat --loglevel=warning
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - backend-internal
      - egress
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  flower:
    image: agent_backend:dev
    container_name: agent_flower
    command: celery -A app.worker.celery_app flower --port=5555
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=false
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    networks:
      - backend-internal
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so they
      # must be build args — an `environment:` entry cannot override them, and
      # changing one needs a rebuild (docker compose -f docker-compose.prod.yml
      # build --no-cache frontend). Every value here has to be reachable from
      # the BROWSER, not from inside the compose network.
      args:
        # No proxy in front, so the browser talks to the published ports.
        # Set PUBLIC_HOST to this host's address — the localhost default only
        # works when the browser runs on the Docker host itself.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:38001}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://${PUBLIC_HOST:-localhost}:38001}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://${PUBLIC_HOST:-localhost}:38000}
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=${NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB:-50}
        - NEXT_PUBLIC_RAG_ENABLED=true
    container_name: agent_frontend
    environment:
      - NODE_ENV=production
      # Server-side only: resolved inside the compose network by the Next server.
      - BACKEND_URL=http://app:38001
      # The auth cookies are Secure in production, and a browser discards a
      # Secure cookie that arrives over plain HTTP — login then "works" while
      # every request after it is 401. Serve this over TLS, or set
      # COOKIE_SECURE=false if it really is http:// on a trusted network.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    networks:
      - backend-internal
      - egress
    ports:
      - "127.0.0.1:38000:38000"
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

networks:
  backend-internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  rerank_models:
    external: true
    name: agent_rerank_models
  rag_models:
    external: true
    name: agent_rag_models
  media_data:
  postgres_data:
  redis_data:
