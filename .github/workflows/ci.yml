name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Test-only configuration: model requests are mocked; never use production keys.
  OPENAI_API_KEY: ci-placeholder-not-a-real-key
  OPENAI_BASE_URL: http://127.0.0.1:9/v1
  DEBUG: "false"

jobs:
  git-sync:
    name: Git synchronization checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test safe synchronization with local repositories
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check committed source for excluded files and credentials
        run: python3 scripts/git_sync.py check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev --frozen --python 3.12

      - name: Run ruff check
        run: uv run --directory backend ruff check app tests cli

      - name: Run ruff format check
        run: uv run --directory backend ruff format app tests cli --check

      - name: Run ty
        run: uv run --directory backend ty check

  conversation-access:
    name: Knowledge and conversation regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --directory backend --dev --frozen --python 3.12
      - name: Check knowledge indexing, retrieval, account isolation and conversations
        run: >-
          uv run --directory backend pytest
          tests/api/test_conversation_access.py
          tests/test_services_conversation.py
          tests/test_model_config.py
          tests/test_knowledge_entries.py
          tests/test_knowledge_enrichment.py
          tests/test_knowledge_retrieval.py
          tests/test_knowledge_index.py
          tests/test_retrieval_snapshot.py -q

  test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --directory backend --dev --frozen --python 3.12
      - name: Run full unit suite with bounded runtime and coverage
        working-directory: backend
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 10m uv run --frozen pytest tests/ -v --cov=app --cov-report=xml --cov-report=term:skip-covered --junitxml=test-results.xml 2>&1 | tee test-output.log
      - name: Preserve test results even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results
          path: |
            backend/test-output.log
            backend/test-results.xml
            backend/coverage.xml

  test-database:
    name: PostgreSQL workflow and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ci_review
      RUN_TASK_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --directory backend --dev --frozen --python 3.12
      - name: Verify migrations on disposable database
        run: uv run --directory backend --frozen pytest tests/test_migrations.py -v
        env:
          RUN_MIGRATION_DB_TESTS: "1"
      - name: Initialize task checkpoints
        run: uv run --directory backend --frozen python -m app.worker.agent_runs --setup
      - name: Check account isolation, memory, tasks and retrieval against PostgreSQL
        working-directory: backend
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 10m uv run --frozen pytest tests/test_memory_integration.py tests/test_memory_lifecycle_integration.py tests/test_project_spaces_integration.py tests/test_agent_runs_integration.py tests/test_durable_chat.py tests/test_chat_exports_integration.py tests/test_conversation_context_integration.py tests/test_knowledge_collaboration.py tests/test_database_retrieval.py tests/test_retrieval_snapshot_integration.py tests/test_run_artifacts_integration.py tests/test_faq_alternatives_integration.py -v --junitxml=database-results.xml 2>&1 | tee database-output.log
      - name: Preserve database test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-database-results
          path: |
            backend/database-output.log
            backend/database-results.xml

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Run lint
        run: bun run lint
        working-directory: frontend

      - name: Run type check
        run: bun run type-check
        working-directory: frontend

      - name: Run unit tests with coverage
        run: bun run test:coverage
        working-directory: frontend

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend for browser tests
        run: bun run build
        working-directory: frontend

      - name: Run E2E tests
        run: bun run test:e2e
        working-directory: frontend
        env:
          CI: true

      - name: Preserve frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-results
          path: |
            frontend/coverage
            frontend/playwright-report
            frontend/test-results

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev --frozen --python 3.12

      - name: Install pip-audit
        run: uv pip install --python backend/.venv/bin/python pip-audit

      - name: Run pip-audit
        run: .venv/bin/pip-audit --progress-spinner=off
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, test-database, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
